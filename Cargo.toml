[workspace]
resolver = "3"
members = [
    "crates/storage",
    "crates/engine",
    "crates/library",
    "crates/core",
    "crates/uniffi-bindgen",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"
publish = false
rust-version = "1.88"

[workspace.dependencies]
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
thiserror = "2"
fastrand = "2"
log = "0.4"
dotenvy = "0.15"
symphonia = { version = "0.6", default-features = false, features = ["flac", "pcm", "wav", "aiff", "isomp4", "alac", "all-meta", "opt-simd"] }
rtrb = "0.4"
sonorus-storage = { path = "crates/storage" }
rusqlite = { version = "0.41", features = ["bundled"] }
lofty = "0.25"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = "0.32"
sonorus-engine = { path = "crates/engine" }
sonorus-library = { path = "crates/library" }

[profile.release]
lto = "thin"
codegen-units = 1
# Keep the symbol table: uniffi-bindgen reads its metadata symbols from the .so.
# AGP strips the packaged copy (stripDebugDebugSymbols / stripReleaseDebugSymbols).
strip = "debuginfo"

# Fast-to-build optimized profile for Android debug APKs (audio code is too slow unoptimized).
[profile.android-dev]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
