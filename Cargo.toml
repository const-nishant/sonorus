[workspace]
resolver = "3"
members = ["crates/storage", "crates/engine", "crates/library"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
aws-sdk-s3 = "1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
thiserror = "2"
fastrand = "2"
log = "0.4"
dotenvy = "0.15"
symphonia = { version = "0.6", default-features = false, features = ["flac", "pcm", "wav", "aiff", "isomp4", "alac", "all-meta", "opt-simd"] }
rtrb = "0.4"
sonorus-storage = { path = "crates/storage" }
rusqlite = { version = "0.41", features = ["bundled"] }
lofty = "0.25"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
