[workspace]
resolver = "3"
members = ["crates/storage"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
aws-sdk-s3 = "1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
thiserror = "2"
fastrand = "2"
log = "0.4"
dotenvy = "0.15"
