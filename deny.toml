# Policy for `cargo deny check`, run by the "Rust · dependency audit" job in CI.

[advisories]
# Vulnerabilities and unsound crates fail the check. Only unmaintained-only advisories are ignored.
ignore = [
    # basic-toml is unmaintained, with no safe upgrade. It comes from askama_derive, a proc-macro
    # used by uniffi-bindgen at build time. It is not shipped in the app.
    { id = "RUSTSEC-2026-0374", reason = "unmaintained only; build-time proc-macro dependency of uniffi-bindgen" },
    # paste is unmaintained, with no safe upgrade. It is a proc-macro pulled in by lofty at build
    # time. It is not shipped in the app.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained only; build-time proc-macro dependency of lofty" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    # The project itself is GPL-3.0-or-later.
    "GPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
