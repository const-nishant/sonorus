name: Release

# release-please, the release build and the upload run in this one workflow: a release created
# with the default GITHUB_TOKEN does not trigger other workflows.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: "Prerelease tag to create on this commit, e.g. v0.13.1-rc.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  build:
    name: Build & publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      # Build provenance attestation (actions/attest-build-provenance) signs with the workflow's OIDC identity.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # The version comes from the tag: a dispatch run tags its own commit first.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease_tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Create prerelease tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "prerelease_tag must look like v0.13.1-rc.1" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists" >&2
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Create prerelease
        if: github.event_name == 'workflow_dispatch'
        run: gh release create "$TAG" --prerelease --generate-notes --verify-tag

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install SDK packages
        run: sdkmanager "ndk;28.2.13676358" "platforms;android-37.0" "build-tools;37.0.0"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          SONORUS_KEYSTORE_PASSWORD: ${{ secrets.SONORUS_KEYSTORE_PASSWORD }}
          SONORUS_KEY_ALIAS: ${{ secrets.SONORUS_KEY_ALIAS }}
          SONORUS_KEY_PASSWORD: ${{ secrets.SONORUS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set; release artifacts must be signed" >&2
            exit 1
          fi
          if [ -z "$SONORUS_KEYSTORE_PASSWORD" ] || [ -z "$SONORUS_KEY_ALIAS" ] || [ -z "$SONORUS_KEY_PASSWORD" ]; then
            echo "::error::SONORUS_KEYSTORE_PASSWORD, SONORUS_KEY_ALIAS and SONORUS_KEY_PASSWORD must be set" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      # The passwords go to this step only, never to $GITHUB_ENV, so later steps cannot see them.
      - name: Build release APK and AAB
        working-directory: android
        env:
          SONORUS_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          SONORUS_KEYSTORE_PASSWORD: ${{ secrets.SONORUS_KEYSTORE_PASSWORD }}
          SONORUS_KEY_ALIAS: ${{ secrets.SONORUS_KEY_ALIAS }}
          SONORUS_KEY_PASSWORD: ${{ secrets.SONORUS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Check artifacts for bucket secrets
        env:
          SONORUS_S3_ACCESS_KEY_ID: ${{ secrets.SONORUS_S3_ACCESS_KEY_ID }}
          SONORUS_S3_SECRET_ACCESS_KEY: ${{ secrets.SONORUS_S3_SECRET_ACCESS_KEY }}
          SONORUS_S3_BUCKET: ${{ secrets.SONORUS_S3_BUCKET }}
          SONORUS_S3_ENDPOINT: ${{ secrets.SONORUS_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          scripts/check-apk-secrets.sh android/app/build/outputs/apk/release/app-release.apk
          scripts/check-apk-secrets.sh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload release assets
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release-assets"
          mkdir -p "$out"
          cp android/app/build/outputs/apk/release/app-release.apk "$out/sonorus-$TAG.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "$out/sonorus-$TAG.aab"
          cd "$out"
          sha256sum "sonorus-$TAG.apk" "sonorus-$TAG.aab" > SHA256SUMS
          gh release upload "$TAG" "sonorus-$TAG.apk" "sonorus-$TAG.aab" SHA256SUMS --clobber

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            ${{ runner.temp }}/release-assets/sonorus-${{ env.TAG }}.apk
            ${{ runner.temp }}/release-assets/sonorus-${{ env.TAG }}.aab

      - name: Add install and verify notes
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          gh release view "$TAG" --json body -q .body > "$notes"
          # A re-run must not append the section twice.
          if grep -q '^## Install$' "$notes"; then
            echo "install notes already present"
            exit 0
          fi
          cat >> "$notes" <<EOF

          ## Install

          Download \`sonorus-$TAG.apk\` and open it on an Android 14+ arm64 device.

          ## Verify

          \`\`\`sh
          sha256sum -c SHA256SUMS
          gh attestation verify sonorus-$TAG.apk --repo $GITHUB_REPOSITORY
          \`\`\`
          EOF
          gh release edit "$TAG" --notes-file "$notes"

      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
